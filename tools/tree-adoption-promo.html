<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adote uma árvore · Trombone Cidadão</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; display: grid; justify-items: center; background: #08291e; font-family: Arial, sans-serif; }
  canvas { display: block; width: min(100vw, 540px); height: auto; }
  button { margin: 16px; padding: 15px 24px; border: 0; border-radius: 30px; background: #def59a; color: #133c2b; font-weight: 700; cursor: pointer; }
</style>
<canvas id="film" width="1080" height="1920" aria-label="Vídeo narrado do programa Adote uma árvore"></canvas>
<button onclick="playPromo()">Assistir com narração</button>
<script>
const canvas = document.getElementById('film'), ctx = canvas.getContext('2d');
const W = 720, H = 1280, LIME = '#def59a';
const photos = {};
let timing, ui, playing = false;
const clamp = n => Math.min(1, Math.max(0, n));
const smooth = n => { n = clamp(n); return n*n*(3-2*n); };
const back = n => { n = clamp(n)-1; return 1 + 2.70158*n*n*n + 1.70158*n*n; };

function round(x,y,w,h,r,color) {
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fillStyle=color; ctx.fill();
}
function text(value,x,y,size=30,color='#fff',weight=400,align='left') {
  ctx.font = `${weight} ${size}px Arial`; ctx.fillStyle=color; ctx.textAlign=align; ctx.fillText(value,x,y);
}
function wordsIn(value,x,y,size,color,local,delay=0) {
  ctx.font = `700 ${size}px Arial`;
  let offset=0;
  value.split(' ').forEach((word,index) => {
    const amount=back((local-delay-index*.065)/.42);
    const width=ctx.measureText(word+' ').width;
    ctx.save(); ctx.globalAlpha=clamp(amount); ctx.translate(x+offset,y+35*(1-amount));
    ctx.scale(1,Math.max(.1,amount)); text(word,0,0,size,color,700); ctx.restore(); offset+=width;
  });
}
function cover(img,x,y,w,h,zoom=1) {
  const scale=Math.max(w/img.width,h/img.height)*zoom, iw=img.width*scale, ih=img.height*scale;
  ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}
function leafPath() {
  ctx.beginPath();ctx.moveTo(0,25);ctx.bezierCurveTo(1,3,22,-10,33,-8);ctx.bezierCurveTo(37,16,15,32,0,25);
}
function sprout(local) {
  const growth=back(local/.95);
  ctx.save();ctx.translate(350,665);ctx.scale(growth,growth);
  ctx.fillStyle='#d9eaa535';ctx.beginPath();ctx.ellipse(0,12,125,18,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=LIME;ctx.lineWidth=9;ctx.lineCap='round';
  ctx.setLineDash([250]);ctx.lineDashOffset=250*(1-smooth(local/.8));
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-5,-70,4,-140,20,-194);ctx.stroke();
  ctx.setLineDash([]);
  [[-4,-80,-2.7,-2.2],[5,-130,2.9,2.5]].forEach(([x,y,sx,sy],index) => {
    const amount=back((local-.25-index*.13)/.65);ctx.save();ctx.translate(x,y);ctx.scale(sx*amount,sy*amount);
    leafPath();ctx.fillStyle='#def59a45';ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=LIME;
    ctx.setLineDash([150]);ctx.lineDashOffset=150*(1-smooth((local-.1)/.8));ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(-3,30);ctx.lineTo(25,0);ctx.stroke();ctx.restore();
  });
  ctx.restore();
}
function background(index,local,progress) {
  ctx.fillStyle='#08291e';ctx.fillRect(0,0,W,H);
  if(index===0||index===4) {
    cover(photos[index===0?'tree':'rega'],0,0,W,H,1+progress*.08);
    const shade=ctx.createLinearGradient(0,0,0,H);
    shade.addColorStop(0,'#072c21dd');shade.addColorStop(.5,'#082d2199');shade.addColorStop(1,'#05261af5');
    ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
  } else {
    const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b3b2a');g.addColorStop(1,'#07281e');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#bde98a14';ctx.lineWidth=1;
    for(let n=0;n<5;n++){ctx.beginPath();ctx.arc(780+Math.sin(local*.4)*12,520,190+n*95,0,Math.PI*2);ctx.stroke();}
  }
  // Deterministic drifting light particles, identical in every render.
  for(let n=0;n<14;n++) {
    const x=(n*173+Math.sin(local*.3+n)*20)%720,y=(n*121-local*(10+n%5)+2560)%1280;
    ctx.globalAlpha=.10+.05*Math.sin(local+n);ctx.fillStyle=LIME;ctx.beginPath();ctx.arc(x,y,2+n%3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function brand() {
  round(48,106,44,44,12,'#fff');ctx.drawImage(photos.logo,53,111,34,34);
  text('Trombone Cidadão',106,136,24,'#fff',700);
}
function tag(value) { text(value,48,191,17,LIME,700); }
function tap(rect,local,when) {
  if(!rect)return;const elapsed=local-when;if(elapsed<-.18||elapsed>.5)return;
  const x=-165+(rect.x+rect.width*.5)*330/390,y=-330/390*360+(rect.y+rect.height*.5)*330/390;
  const p=clamp((elapsed+.18)/.68), radius=12+28*p;
  ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle=LIME;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=clamp(1-Math.abs(elapsed)/.3);ctx.fillStyle=LIME;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.restore();
}
function patchFromShot(name,rect,scale) {
  if(!rect)return;const factor=330/390,x=-165+rect.x*factor,y=-330/390*360+rect.y*factor,w=rect.width*factor,h=rect.height*factor;
  ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(scale,scale);
  ctx.drawImage(photos[name],rect.x*2,rect.y*2,rect.width*2,rect.height*2,-w/2,-h/2,w,h);ctx.restore();
}
function phone(index,local) {
  const height=330/390*720;
  const scene=timing.scenes[index], action=Math.max(0,(local-scene.speechOffset)/scene.interactionScale);
  let name;
  if(index===1)name=action<.7?'pedido-start':action<1.55?'pedido-muda':action<1.85?'pedido-scroll':'pedido-sombra';
  if(index===2)name=action<1.45?'mudas-1':'mudas-2';
  if(index===3)name=action<.9?'pedidos-enviado':'pedidos-analise';
  ctx.save();
  const entry=back(local/.55), float=Math.sin(local*1.8)*4.5;
  ctx.translate(358,582+float+38*(1-entry));ctx.rotate(Math.sin(local*.9+index)*.012);
  // Small shear and side edge suggest yaw; the screen and touches share this transform.
  ctx.transform(1,Math.sin(local*.8)*.012,Math.cos(local*.7)*.008,1,0,0);
  ctx.scale(.97+.03*entry,.97+.03*entry);
  ctx.shadowColor='#0009';ctx.shadowBlur=35+Math.sin(local)*4;ctx.shadowOffsetY=19+float;
  round(-181,-height/2-13,362,height+26,28,'#70927b');ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  round(-178,-height/2-13,356,height+26,26,'#061c14');
  ctx.save();ctx.beginPath();ctx.roundRect(-165,-height/2,330,height,18);ctx.clip();
  ctx.drawImage(photos[name],-165,-height/2,330,height);
  if(index===1) {
    tap(ui['pedido-start'].muda,action,.65);
    if(action>1.6)tap(ui['pedido-sombra'].sombra,action,1.8);
    tap(ui['pedido-sombra'].continuar,action,3.1);
  }
  if(index===2)tap(ui['mudas-1'].plus,action,1.4);
  if(index===3&&action>=.9) {
    const p=clamp((action-.9)/.45),rect=ui['pedidos-analise'].badge;
    patchFromShot(name,rect,1+Math.sin(p*Math.PI)*.14);
    const r=ui['pedidos-analise'].progress,factor=330/390;
    const bx=-165+(r.x+r.width/3)*factor,by=-height/2+r.y*factor,bw=r.width/3*factor-6;
    round(bx,by,bw,3,2,'#e3e7e9');round(bx,by,bw*smooth(p),3,2,'#20522f');
  }
  ctx.restore();ctx.restore();
  if(index===2&&action>1.45) {
    const p=back((action-1.45)/.4);ctx.save();ctx.translate(536,450);ctx.scale(p,p);
    round(-68,-26,130,48,24,LIME);text('+1 muda',-3,6,21,'#123c28',700,'center');ctx.restore();
  }
  text('Telas demonstrativas',358,915,18,'#c8d7c7',400,'center');
}
function intro(local) {
  tag('FLORESTA · PE');
  wordsIn('Uma muda hoje.',48,278,64,'#fff',local);
  wordsIn('Mais vida amanhã!',48,348,53,LIME,local,.2);
  sprout(local);
  wordsIn('Mais sombra.',48,758,47,'#fff',local,.4);
  wordsIn('Mais verde. Mais vida!',48,817,43,LIME,local,.6);
}
function outro(local) {
  tag('ADOTE UMA ÁRVORE');
  wordsIn('Plante cuidado.',48,268,59,'#fff',local);
  wordsIn('Transforme Floresta!',48,330,46,LIME,local,.15);
  const pulse=1+.018*Math.sin(local*5);
  ctx.save();ctx.translate(348,409);ctx.scale(pulse,pulse);round(-300,-39,600,78,39,LIME);
  text('Solicite sua muda',0,12,35,'#143e2a',700,'center');ctx.restore();
  text('Baixe o app',48,552,31,'#fff',700);text('Trombone Cidadão',48,598,31,LIME,700);
  text('Floresta · PE',48,650,25,'#e0ebdc');
  const qr=back((local-.3)/.5);ctx.save();ctx.translate(551,577);ctx.scale(qr,qr);round(-87,-87,174,174,18,'#fff');ctx.drawImage(photos.qr,-77,-77,154,154);ctx.restore();
  text('trombonecidadao.com.br',48,737,36,'#fff',700);
  text('Sujeito à avaliação e',48,815,28,'#e0ebdc',500);
  text('disponibilidade de mudas.',48,854,28,'#e0ebdc',500);
}
function drawScene(index,local) {
  local=Math.max(0,local);const scene=timing.scenes[index];
  background(index,local,clamp(local/scene.duration));brand();
  if(index===0)intro(local);
  else if(index===4)outro(local);
  else {
    tag(['','01 / SOLICITE','02 / ESCOLHA','03 / ACOMPANHE'][index]);
    const headlines=[[],['Seu pedido começa aqui.'],['Escolha. Ajuste. Pronto!'],['Enviou? Acompanhe!']][index];
    wordsIn(headlines[0],48,247,38,'#fff',local);
    phone(index,local);
  }
}
function caption(index,local) {
  if(local<0||local>timing.scenes[index].speechDuration+.12)return;
  const words=timing.scenes[index].words;
  let active=words.findIndex((word,n)=>local>=word.start&&local<(words[n+1]?.start??Infinity));
  if(active<0)active=0;
  const start=Math.floor(active/5)*5, group=words.slice(start,start+5), lines=[[]];
  ctx.font='700 32px Arial';let width=0;
  group.forEach((word,n)=>{const w=ctx.measureText(word.text+' ').width;if(width+w>575&&lines.at(-1).length){lines.push([]);width=0}lines.at(-1).push({...word,index:start+n,width:w});width+=w;});
  round(38,934,628,84,20,'#041f17eb');
  lines.forEach((line,lineIndex)=>{
    const lineWidth=line.reduce((sum,word)=>sum+word.width,0);let x=352-lineWidth/2;
    for(const word of line){const current=word.index===active;
      const hop=current?Math.sin(clamp((local-word.start)/Math.max(word.duration,.1))*Math.PI)*5:0;
      text(word.text,x,lines.length===1?987-hop:969+lineIndex*36-hop,32,current?LIME:'#fff',700);x+=word.width;
    }
  });
}
function progress(time) {
  let x=48;
  for(const scene of timing.scenes){const width=600*scene.duration/timing.duration-5;
    round(x,1036,width,4,2,'#ffffff24');const fill=clamp((time-scene.start)/scene.duration);
    if(fill>0)round(x,1036,width*fill,4,2,LIME);x+=width+5;
  }
}
window.drawPromo=function(time) {
  time=Math.max(0,Math.min(time,timing.duration-.001));ctx.setTransform(1.5,0,0,1.5,0,0);ctx.globalAlpha=1;
  const index=timing.scenes.findLastIndex(scene=>time>=scene.start),local=time-timing.scenes[index].start;
  drawScene(index,local);
  // Next scene wipes in during the short pause; no fade through black.
  if(index<4){const until=timing.scenes[index+1].start-time;
    if(until<.24){const p=smooth(1-until/.24);ctx.save();ctx.beginPath();ctx.rect(W*(1-p),0,W*p,H);ctx.clip();drawScene(index+1,p*.24);ctx.restore();round(W*(1-p)-2,0,4,H,LIME);}
  }
  caption(index,local-timing.scenes[index].speechOffset);progress(time);
};
window.renderFrameBatch=function(start,count){const frames=[];for(let frame=start;frame<start+count;frame++){drawPromo(frame/30);frames.push(canvas.toDataURL('image/jpeg',.97).split(',')[1])}return frames};
function stamp(seconds){return new Date(Math.round(seconds*1000)).toISOString().slice(11,23).replace('.',',')}
window.playPromo=async function(){if(playing)return;playing=true;const context=new AudioContext();await context.resume();const response=await fetch('assets/mix.wav');const source=context.createBufferSource();source.buffer=await context.decodeAudioData(await response.arrayBuffer());source.connect(context.destination);const start=context.currentTime+.1;source.start(start);await new Promise(resolve=>{function frame(){const now=Math.max(0,context.currentTime-start);drawPromo(now);if(now<timing.duration)requestAnimationFrame(frame);else resolve()}frame()});await context.close();playing=false};
(async()=>{
  [timing,ui]=await Promise.all([fetch('assets/timing.json').then(r=>r.json()),fetch('assets/ui.json').then(r=>r.json())]);
  await Promise.all(['tree','rega','logo','qr','pedido-start','pedido-muda','pedido-scroll','pedido-sombra','mudas-1','mudas-2','pedidos-enviado','pedidos-analise'].map(async name=>{const img=new Image();img.src='assets/'+name+(name==='tree'||name==='rega'?'.webp':'.png');await img.decode();photos[name]=img}));
  const cues=[];timing.scenes.forEach(scene=>{for(let n=0;n<scene.words.length;n+=5){const words=scene.words.slice(n,n+5),end=scene.words[n+5]?.start??scene.speechDuration;cues.push(stamp(scene.start+scene.speechOffset+words[0].start)+' --> '+stamp(scene.start+scene.speechOffset+end)+'\n'+words.map(w=>w.text).join(' '));}});
  window.promoSrt=cues.map((cue,index)=>(index+1)+'\n'+cue).join('\n\n')+'\n';
  window.promoInfo=timing;drawPromo(0);window.promoReady=true;
})().catch(error=>{window.promoError=String(error);console.error(error)});
</script>
</html>
